<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 580" width="512" height="580">
  <!-- Main Squircle Icon Base -->
  <path d="M 256,36 C 410,36 456,82 456,236 C 456,390 410,436 256,436 C 102,436 56,390 56,236 C 56,82 102,36 256,36 Z" fill="#A6A6A6" />

  <!-- Top-Left Dark Circle -->
  <circle cx="176" cy="156" r="68" fill="#3D3D3D" />
  
  <!-- Plus Sign inside Top-Left Circle -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <line x1="176" y1="124" x2="176" y2="188" />
    <line x1="144" y1="156" x2="208" y2="156" />
  </g>
  
  <!-- Small Shopping Basket Icon (Top-Right of Plus) -->
  <g transform="translate(192, 114)" fill="none" stroke="#A6A6A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4,10 L 24,10 L 21,21 L 7,21 Z" fill="#A6A6A6" />
    <line x1="8" y1="10" x2="12" y2="3" />
    <line x1="20" y1="10" x2="16" y2="3" />
    <line x1="10" y1="13" x2="10" y2="18" stroke="#3D3D3D" stroke-width="1.8" />
    <line x1="14" y1="13" x2="14" y2="18" stroke="#3D3D3D" stroke-width="1.8" />
    <line x1="18" y1="13" x2="18" y2="18" stroke="#3D3D3D" stroke-width="1.8" />
  </g>
  
  <!-- Small Minus Line (Bottom-Right of Plus) -->
  <line x1="194" y1="178" x2="218" y2="178" stroke="#A6A6A6" stroke-width="5" stroke-linecap="round" />

  <!-- Bottom-Left Dark Circle -->
  <circle cx="176" cy="316" r="68" fill="#3D3D3D" />
  
  <!-- Percentage & Rupee Symbols inside Bottom-Left Circle -->
  <text x="176" y="336" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle" letter-spacing="-2">%₹</text>

  <!-- Right Green Pill Button -->
  <rect x="268" y="88" width="136" height="296" rx="68" fill="#23A516" />
  
  <!-- Equals Sign inside Green Pill -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <line x1="306" y1="222" x2="366" y2="222" />
    <line x1="306" y1="250" x2="366" y2="250" />
  </g>

  <!-- Home & Shopping Bag Icons at Bottom of Green Pill -->
  <g transform="translate(298, 304)" fill="#FFFFFF">
    <!-- Home Icon -->
    <path d="M 16,2 L 2,14 L 6,14 L 6,28 L 13,28 L 13,20 L 19,20 L 19,28 L 26,28 L 26,14 L 30,14 Z" />
    
    <!-- Shopping Bag Icon -->
    <g transform="translate(42, 2)">
      <path d="M 5,8 L 25,8 L 27,26 L 3,26 Z" rx="2" />
      <path d="M 10,8 C 10,2 20,2 20,8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="11" cy="12" r="1.3" fill="#23A516" />
      <circle cx="19" cy="12" r="1.3" fill="#23A516" />
    </g>
  </g>

  <!-- Brand Name Text -->
  <text x="256" y="518" fill="#3D3D3D" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" text-anchor="middle" letter-spacing="-1">BazaarCalc</text>
</svg>